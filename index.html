<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LibraCat — Library Catalogue</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
  <nav class="navbar">
    <div class="logo">📚 LibraCat</div>
    <ul class="nav-links">
      <li><a href="#catalogue">Browse</a></li>
      <li><a href="#about">About</a></li>
    </ul>
  </nav>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>Discover Your Next Read</h1>
    <p>Browse our curated catalogue of books across every genre.</p>
    <a href="#catalogue" class="btn-primary">Browse Catalogue</a>
  </div>
</section>

  <section id="catalogue" class="catalogue-section">
  <div class="catalogue-header">
    <h2>Browse Books</h2>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search by title or author…" />
      <select id="genreFilter">
        <option value="all">All Genres</option>
      </select>
    </div>
  </div>
  <div class="book-grid" id="bookGrid"></div>
</section>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">&times;</button>
    <div class="modal-content" id="modalContent"></div>
  </div>
</div>

  <footer id="about">
  <p>LibraCat &copy; 2026 &mdash; Built by Joshua Adalo | 154226 · Strathmore University</p>
</footer>
  <script src="data/books.js"></script>
  <script src="app.js"></script>
</body>
</html>
